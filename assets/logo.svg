<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="memex-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="memex-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#memex-bg)"/>

  <!-- Stacked memory layers, each one slightly wider than the one above. -->
  <rect x="68" y="80"  width="120" height="14" rx="4" fill="#10b981" opacity="0.45"/>
  <rect x="56" y="104" width="144" height="14" rx="4" fill="#10b981" opacity="0.65"/>
  <rect x="44" y="128" width="168" height="14" rx="4" fill="#10b981" opacity="0.85"/>

  <!-- Stylized M letterform sitting on the stack. -->
  <path d="M64 192 L64 156 L96 156 L128 196 L160 156 L192 156 L192 192 L172 192 L172 174 L142 212 L114 212 L84 174 L84 192 Z"
        fill="url(#memex-accent)"/>

  <!-- Single index dot — "you are here". -->
  <circle cx="220" cy="220" r="8" fill="#22d3ee"/>
</svg>
