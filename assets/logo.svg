<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="memex-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="memex-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#memex-bg)"/>

  <!-- Single-stroke M (zigzag): bold, readable at 16px. -->
  <path d="M 56 196 L 56 64 L 80 64 L 128 144 L 176 64 L 200 64 L 200 196"
        stroke="url(#memex-stroke)"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- "You are here" accent dot at end of timeline. -->
  <circle cx="216" cy="200" r="8" fill="#34d399"/>
</svg>
