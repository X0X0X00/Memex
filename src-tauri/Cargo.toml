[package]
name = "memex"
version = "0.2.3"
description = "Browse and analyze your AI conversation history. Local-only."
authors = ["zzh"]
edition = "2021"
license = "MIT"
repository = "https://github.com/X0X0X00/Memex"
homepage = "https://github.com/X0X0X00/Memex"

[lib]
name = "memex_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "memex"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
once_cell = "1"
tiktoken-rs = "0.5"
jieba-rs = "0.6"
regex = "1"
tauri-plugin-dialog = "2"
